# 운영(VPS) 덧씌우기: HTTPS 프록시(Caddy)를 앞에 두고, 공개용 설정을 강제한다. 절차는 docs/deploy.md 6장.
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# 기본 docker-compose.yml과 합쳐 쓰는 파일이라 단독으로 실행하지 않는다.
services:
  app:
    environment:
      # 공개 서버 설정은 .env로 바꿀 수 없게 여기서 고정한다 (실수로 데모 모드·HTTP 쿠키로 열리는 것을 막는다)
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?.env.production에 ADMIN_PASSWORD(12자 이상)를 설정하세요}"

  # 인터넷에서 오는 요청은 이 프록시만 받는다: 인증서(Let's Encrypt)를 자동으로 받고 갱신하며, 앱(3000)과 DB(5432)는 밖에 열지 않는다.
  caddy:
    profiles: ["app"]
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: "${DOMAIN:?.env.production에 DOMAIN을 설정하세요 (예 qa.example.com)}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 인증서 보관 (지우면 다시 발급받는다)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
